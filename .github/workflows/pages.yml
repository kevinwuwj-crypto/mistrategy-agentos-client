name: Publish client metadata
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check exact public files and metadata
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path('site')
          expected = {'index.html', 'oauth-client.json', '.nojekyll'}
          assert {p.name for p in root.iterdir()} == expected, 'Unexpected public file'
          assert all(p.is_file() and not p.is_symlink() for p in root.iterdir())
          doc = json.loads((root / 'oauth-client.json').read_text())
          owner = os.environ['REPOSITORY_OWNER'].lower()
          repo = os.environ['REPOSITORY_NAME']
          assert repo == 'mistrategy-agentos-client'
          base = f'https://{owner}.github.io/{repo}/'
          assert doc == {
              'client_id': base + 'oauth-client.json',
              'client_name': 'MIStrategy for DSHDesktop',
              'client_uri': base,
              'application_type': 'native',
              'redirect_uris': ['http://127.0.0.1:43872/oauth/callback'],
              'grant_types': ['authorization_code'],
              'response_types': ['code'],
              'token_endpoint_auth_method': 'none',
          }, 'Unexpected OAuth metadata'
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy metadata
        id: deployment
        uses: actions/deploy-pages@v4
